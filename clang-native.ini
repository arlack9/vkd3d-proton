[binaries]
c = 'clang-cl.exe'
cpp = 'clang-cl.exe'
ar = 'llvm-ar'

[properties]
c_args = ['-Wall', '-Wextra', '-Wno-incompatible-pointer-types', '-DWIN32', '-D_WINDOWS', '-D_WIN32_WINNT=0x600', '-O2', '-DNDEBUG']
cpp_args = ['-O2', '-DNDEBUG']
c_std = 'c11'
cpp_std = 'c++17'

[built-in options]
buildtype = 'release'